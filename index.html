<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For Chloe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Nunito:wght@400;600&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
<section class="hero">
  <h1>Happy monthsary, CHLOE!</h1>
  <p>Here’s how long I’ve been the lucky one:</p>
  <div class="count" id="count" aria-live="off"></div>
  <p>pleaseee, scroll down. i made something for you hihihih.</p>
</section>

<section>
  <h2>Our moments</h2>
  <ul class="tl" id="tl"></ul>
</section>

<section class="letter">
  <h2>ohh one more thing, bebe:)</h2>
  <button id="open">please click this for meee</button>
  <div id="paper" aria-live="polite"></div>
  <div id="ask">
    <p id="q">Will you be my girlfriend for another month?</p>
    <div class="btns" id="btns"><button id="yes">Yes</button><button id="no">No</button></div>
    <div id="done" style="display:none;font-family:Fraunces,serif;font-size:1.5rem">YEHEEYY. I LOVE YOU SO MUCH, BABYY. ♥</div>
  </div>
</section>
</main>
<button id="mute" aria-label="Pause music">♪</button>

<script src="script.js"></script>
</body>
</html>
